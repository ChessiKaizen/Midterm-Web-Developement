<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f4f4;
      color: white;
    }

    .nav {
      background-color: rgb(2, 2, 56);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 60px;
    }

    .nav .logo {
      font-weight: bold;
      font-size: 20px;
      color: white;
    }

    .nav ul {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav ul li {
      margin-left: 20px;
    }

    .nav ul li a {
      color: white;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .nav ul li a:hover {
      color: #fcfcfc;
    }

    #Admin-portal {
      font-weight: bold;
      color: rgb(0, 0, 0);
      margin: 40px 50px 20px;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 0 50px 50px;
    }

    .admin-card {
      background: linear-gradient(135deg, #ededed, #2a2a2a);
      border: 1px solid #fefefe;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .admin-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 25px orangered;
    }

    .admin-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .admin-card h3 {
      margin: 15px;
      font-size: 20px;
      color: #300909;
      text-align: center;
    }

    .admin-card p {
      text-align: center;
        font-size: 18px;
        color: aquamarine;
    }
    .admin-card h2 {
      text-align: center;
        font-size: 24px;
        color: orangered;
     }

    .footer {
      margin-top: 100px;
      background-color: rgb(185, 181, 181);
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .nav {
        flex-direction: column;
        height: auto;
        padding: 10px;
      }

      .nav ul {
        flex-direction: column;
        align-items: center;
      }

      .nav ul li {
        margin: 10px 0;
      }

      #Admin-portal {
        text-align: center;
        margin: 20px 0;
        font-size: 22px;
      }

      .admin-grid {
        grid-template-columns: 1fr;
        padding: 0 20px;
      }

      .form-section {
        padding: 20px;
        margin: 20px;
      }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="logo">PulsePoint CIS</div>
    <ul>
      <li><a href="Landingpage.html">Logout</a></li>
    </ul>
  </nav>

  <h2 id="Admin-portal">Admin Portal</h2>

  <div class="admin-grid">
    <div class="admin-card">
      <h3>Patients Alert</h3>
      <p>Alert<br><h2>5 Patients</h2></p>
      <br>
    <div class="admin-card">
      <h3>Bed Availability</h3>
        <p>Available Beds<br><h2>10 Beds</h2></p>
         <br>
    </div>
    <div class="admin-card">
      <h3>Medicine Orders</h3>
        <p>Pending Orders<br><h2>3 Orders</h2></p>
         <br>
    <div class="admin-card">
      <h3>Database Status</h3>
        <p>Operational<br><h2>All Systems</h2></p>
         <br>
     <div class="admin-card">
      <h3>Staff Directory</h3>
       <p>Doctors, Nurses, Admins<br><h2>50 Staff</h2></p>
         <br>
      <br>
    </div>
  </div>
<footer class="footer">© 2026 PulsePoint CIS </footer>

</body>

</html>
